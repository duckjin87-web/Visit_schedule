<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방문예정처 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<script>try{var _t=localStorage.getItem('cosmedb_theme');if(_t&&_t!=='auto')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
</head>
<body>

<div class="appbar">
  <div class="brand"><span class="logo"></span><h1>방문예정처</h1><span class="sub" id="cnt3">0건</span>
    <button class="tbtn" id="themeBtn" type="button" aria-label="테마 전환" title="테마 전환">🌓</button>
  </div>
</div>

<div class="tool">
  <div class="trow"><span class="title">방문예정처</span>
    <span class="note">출발 기준 · 세종 전의면 산단길 22-17</span>
    <span class="spacer"></span>
    <button class="btn" id="addBtn">＋ 신규 등록</button>
    <button class="btn" id="delBtn">🗑 선택 삭제</button>
    <button class="btn" id="viewBtn">🗂 카드보기</button>
    <button class="btn" id="impBtn">⇪ Excel 불러오기</button>
    <button class="btn" id="dataBtn">⋯ 데이터</button>
    <button class="btn" id="statBtn" aria-pressed="false">📊 방문통계</button>
    <button class="btn pri" id="xlsBtn">Excel 저장</button>
    <input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden>
    <input type="file" id="jsonFile" accept=".json,application/json" hidden>
  </div>
  <div class="chips" id="c3"></div>
  <div id="stat3" class="statpanel" hidden></div>
  <div id="mcal3" class="mcal"></div>
  <div class="gts" id="g3"><span class="lb">열 그룹</span></div>
</div>
<div class="body">
  <div class="wrap tall" id="wrap3"><table class="nw" id="t3"></table></div>
  <div id="cards3" class="cards" hidden></div>
  <div class="legend" id="lg3"></div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="undobar" id="undobar"><span id="undomsg"></span><button id="undoBtn" type="button">실행취소</button></div>
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
